<body>

    <section class="grid" id="grid"></section>

function info(name){let type='other', label='其他', date=(name.match(/(\d{4}-\d{2}-\d{2}(?:_to_\d{2}-\d{2})?)/)||['','未标注日期'])[1]; if(name.startsWith('morning')){type='morning';label='晨报'} else if(name.startsWith('night')){type='night';label='夜报'} return {name,type,label,date};}
const items=files.map(info).sort((a,b)=>b.date.localeCompare(a.date)||a.type.localeCompare(b.type));
const grid=document.getElementById('grid');
function render(type='all'){grid.innerHTML=items.filter(x=>type==='all'||x.type===type).map(x=>`<a class="card" href="${x.name}"><span class="badge ${x.type}">${x.label}</span><div class="date">${x.date}</div><div class="desc">${x.label==='晨报'?'今日大模型晨报：快讯、业务视角、技术背景与产品卖点预测。':x.label==='夜报'?'今日大模型夜报：日内变化、工程趋势与可跟进行动。':'大模型日报归档与专题页面。'}</div></a>`).join('')}
document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(btn.dataset.type)});render();
