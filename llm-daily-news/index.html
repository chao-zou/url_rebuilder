<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大模型日报历史总目录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Noto Sans SC',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(circle at 10% 0%,rgba(14,165,233,.22),transparent 28%),radial-gradient(circle at 90% 12%,rgba(168,85,247,.2),transparent 30%),linear-gradient(180deg,#08111f,#0f172a);color:#eef6ff;min-height:100vh}.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);box-shadow:0 24px 80px rgba(0,0,0,.28)}.news-card{display:block;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}.news-card:hover{transform:translateY(-4px);border-color:rgba(125,211,252,.65);box-shadow:0 24px 70px rgba(14,165,233,.18);text-decoration:none}.badge-morning{background:rgba(251,191,36,.16);border-color:rgba(251,191,36,.38);color:#fde68a}.badge-night{background:rgba(129,140,248,.16);border-color:rgba(129,140,248,.38);color:#c7d2fe}a{color:inherit;text-decoration:none}
  </style>
</head>
<body>
  <main class="max-w-6xl mx-auto px-5 py-10">
    <header class="glass rounded-3xl p-8 md:p-10 mb-6">
      <div class="flex flex-wrap gap-2 mb-4"><span class="rounded-full px-3 py-1 text-sm border border-sky-300/30 bg-sky-400/10 text-sky-100">LLM Daily News</span><span class="rounded-full px-3 py-1 text-sm border border-emerald-300/30 bg-emerald-400/10 text-emerald-100">自动目录</span></div>
      <h1 class="text-4xl md:text-5xl font-extrabold mb-3">大模型日报历史总目录</h1>
      <p class="text-slate-300 text-lg">按日期倒序展示晨报/夜报，整张卡片可点击访问。最新更新：2026-09-28 晨报。</p>
    </header>
    <section class="glass rounded-3xl p-5 mb-6 flex flex-wrap gap-3 items-center justify-between">
      <div class="text-slate-300"><span id="count" class="font-bold text-white">0</span> 篇报告</div>
      <div class="flex gap-2"><button id="allBtn" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 border border-white/10">全部</button><button id="morningBtn" class="px-4 py-2 rounded-xl bg-amber-400/15 hover:bg-amber-400/25 border border-amber-300/20">只看晨报</button><button id="nightBtn" class="px-4 py-2 rounded-xl bg-indigo-400/15 hover:bg-indigo-400/25 border border-indigo-300/20">只看夜报</button></div>
    </section>
    <section id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
  </main>
  <script>
    function fmt(d){return d.toISOString().slice(0,10)}
    function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
    function range(start,end){const out=[];for(let d=parse(start);d<=parse(end);d.setUTCDate(d.getUTCDate()+1))out.push(fmt(d));return out}
    const files=[];
    range('2026-06-30','2026-07-10').forEach(d=>files.push({date:d,type:'morning',file:`morning_${d}.html`}));
    range('2026-07-13','2026-09-28').forEach(d=>{const day=parse(d).getUTCDay(); if(day>=1&&day<=5) files.push({date:d,type:'morning',file:`morning_${d}.html`});});
    range('2026-06-29','2026-09-27').forEach(d=>{const day=parse(d).getUTCDay(); if(day!==6) files.push({date:d,type:'night',file:`night_${d}.html`});});
    files.sort((a,b)=>b.date.localeCompare(a.date)||a.type.localeCompare(b.type));
    const grid=document.getElementById('grid'), count=document.getElementById('count');
    function render(filter='all'){
      const data=files.filter(x=>filter==='all'||x.type===filter); count.textContent=data.length;
      grid.innerHTML=data.map(x=>{const isM=x.type==='morning';return `<a class="news-card glass rounded-3xl p-5" href="./${x.file}"><div class="flex items-center justify-between mb-4"><span class="px-3 py-1 rounded-full text-xs border ${isM?'badge-morning':'badge-night'}">${isM?'☀️ 晨报':'🌙 夜报'}</span><span class="text-slate-400 text-sm">${x.date}</span></div><h2 class="text-xl font-bold mb-2">大模型${isM?'晨报':'夜报'} ${x.date}</h2><p class="text-slate-400 text-sm">点击打开 ${x.file}</p></a>`}).join('');
    }
    document.getElementById('allBtn').onclick=()=>render('all'); document.getElementById('morningBtn').onclick=()=>render('morning'); document.getElementById('nightBtn').onclick=()=>render('night'); render();
  </script>
</body>
</html>
