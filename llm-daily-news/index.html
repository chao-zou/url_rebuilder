  <title>大模型日报历史总目录</title>
  <style>
    :root{--bg:#08111f;--card:#111a33;--line:rgba(255,255,255,.12);--text:#eef5ff;--muted:#9fb0d1;--sun:#fbbf24;--night:#818cf8}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:radial-gradient(circle at 20% 0,rgba(251,191,36,.22),transparent 28%),radial-gradient(circle at 80% 10%,rgba(129,140,248,.22),transparent 30%),linear-gradient(180deg,#07111f,#0f172a);color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:42px 18px 72px}.hero{padding:30px;border:1px solid var(--line);border-radius:28px;background:rgba(17,26,51,.82);box-shadow:0 28px 80px rgba(0,0,0,.28)}h1{font-size:clamp(30px,5vw,56px);line-height:1.05;margin:0 0 12px}.meta{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.06);cursor:pointer;color:#dbeafe}.chip.active{background:#eef5ff;color:#0f172a;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{display:block;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));padding:18px;min-height:128px;color:var(--text);text-decoration:none;transition:.18s transform,.18s border-color,.18s background}.card:hover{transform:translateY(-3px);border-color:rgba(110,231,249,.55);background:rgba(255,255,255,.09);text-decoration:none}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;margin-bottom:16px}.morning{background:rgba(251,191,36,.18);color:#fde68a;border:1px solid rgba(251,191,36,.35)}.night{background:rgba(129,140,248,.18);color:#c7d2fe;border:1px solid rgba(129,140,248,.35)}.date{font-size:22px;font-weight:900}.desc{color:#cbd5e1;margin-top:8px;font-size:14px}.footer{margin-top:24px;color:#94a3b8;font-size:13px}

function titleOf(name){const type=name.startsWith('morning')?'morning':name.startsWith('night')?'night':'other'; const date=(name.match(/\d{4}-\d{2}-\d{2}/)||['未标日期'])[0]; const cn=type==='morning'?'☀️ 晨报':type==='night'?'🌙 夜报':'📌 其他'; return {type,date,cn}}
function render(filter='all'){grid.innerHTML=''; archives.filter(n=>filter==='all'||titleOf(n).type===filter).forEach(n=>{const t=titleOf(n); const a=document.createElement('a'); a.className='card'; a.href='./'+n; a.innerHTML=`<span class="badge ${t.type}">${t.cn}</span><div class="date">${t.date}</div><div class="desc">大模型日报 · ${n}</div>`; grid.appendChild(a)})}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(b.dataset.filter)}); render();
