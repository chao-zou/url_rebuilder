<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大模型日报历史总目录</title>
  <style>
    :root{--bg:#f7f8fc;--card:#fff;--ink:#101828;--muted:#667085;--line:#e6e9f2;--morning:#f59e0b;--night:#4f46e5;--shadow:0 10px 28px rgba(16,24,40,.08)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2ff,#f7f8fc 34%,#fff);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
    .wrap{max-width:1180px;margin:0 auto;padding:34px 18px 70px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:22px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:#344054}.btn.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:.18s transform,.18s box-shadow,.18s border-color;min-height:142px}.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(16,24,40,.14);border-color:#b9c3d6}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900}.morning{background:#fff7ed;color:#b45309}.night{background:#eef2ff;color:#4338ca}.weekend{background:#ecfdf3;color:#047857}.date{font-size:22px;font-weight:900;margin:14px 0 8px}.desc{color:var(--muted);font-size:13px}.footer{margin-top:28px;color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:720px){.hero{display:block}.hero h1{font-size:30px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div><h1>大模型日报历史总目录</h1><p>汇总晨报、夜报与周末汇总；卡片可直接点击打开，自动区分类型徽章。</p></div>
      <div class="stats"><div class="stat" id="total">0 篇</div><div class="stat" id="latest">最新：-</div></div>
    </section>
    <section class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="morning">☀️ 晨报</button><button class="btn" data-filter="night">🌙 夜报</button><button class="btn" data-filter="weekend">🧭 周末汇总</button></section>
    <section class="grid" id="cards"></section>
    <p class="footer">GitHub Pages 目录：<a href="https://chao-zou.github.io/url_rebuilder/llm-daily-news/">https://chao-zou.github.io/url_rebuilder/llm-daily-news/</a></p>
  </main>
<script>
const entries = [
  'night_2026-08-30.html','night_2026-08-28.html','morning_2026-08-28.html','night_2026-08-27.html','morning_2026-08-27.html','night_2026-08-26.html','morning_2026-08-26.html','night_2026-08-25.html','morning_2026-08-25.html','night_2026-08-24.html','morning_2026-08-24.html','night_2026-08-23.html','night_2026-08-21.html','morning_2026-08-21.html','night_2026-08-20.html','morning_2026-08-20.html','night_2026-08-19.html','morning_2026-08-19.html','night_2026-08-18.html','morning_2026-08-18.html','night_2026-08-17.html','morning_2026-08-17.html','night_2026-08-16.html','night_2026-08-14.html','morning_2026-08-14.html','night_2026-08-13.html','morning_2026-08-13.html','night_2026-08-12.html','morning_2026-08-12.html','night_2026-08-11.html','morning_2026-08-11.html','night_2026-08-10.html','morning_2026-08-10.html','night_2026-08-09.html','night_2026-08-07.html','morning_2026-08-07.html','night_2026-08-06.html','morning_2026-08-06.html','night_2026-08-05.html','morning_2026-08-05.html','night_2026-08-04.html','morning_2026-08-04.html','night_2026-08-03.html','morning_2026-08-03.html','night_2026-08-02.html','night_2026-07-31.html','morning_2026-07-31.html','night_2026-07-30.html','morning_2026-07-30.html','night_2026-07-29.html','morning_2026-07-29.html','night_2026-07-28.html','morning_2026-07-28.html','night_2026-07-27.html','morning_2026-07-27.html','night_2026-07-26.html','night_2026-07-24.html','morning_2026-07-24.html','night_2026-07-23.html','morning_2026-07-23.html','night_2026-07-22.html','morning_2026-07-22.html','night_2026-07-21.html','morning_2026-07-21.html','night_2026-07-20.html','morning_2026-07-20.html','night_2026-07-19.html','night_2026-07-17.html','morning_2026-07-17.html','night_2026-07-16.html','morning_2026-07-16.html','night_2026-07-15.html','morning_2026-07-15.html','night_2026-07-14.html','morning_2026-07-14.html','night_2026-07-13.html','morning_2026-07-13.html','night_2026-07-12.html','night_2026-07-10.html','morning_2026-07-10.html','night_2026-07-09.html','morning_2026-07-09.html','night_2026-07-08.html','morning_2026-07-08.html','night_2026-07-07.html','morning_2026-07-07.html','night_2026-07-06.html','morning_2026-07-06.html','night_2026-07-05.html','morning_2026-07-05.html','night_2026-07-04.html','morning_2026-07-04.html','night_2026-07-03.html','morning_2026-07-03.html','night_2026-07-02.html','morning_2026-07-02.html','night_2026-07-01.html','morning_2026-07-01.html','night_2026-06-30.html','morning_2026-06-30.html','night_2026-06-29.html'
];
function meta(file){const isMorning=file.startsWith('morning_');const isNight=file.startsWith('night_');const date=(file.match(/(\d{4}-\d{2}-\d{2})/)||[])[1]||file;const d=new Date(date+'T00:00:00');const weekend=[0,6].includes(d.getDay());let type=isMorning?'morning':'night';let label=isMorning?'☀️ 晨报':(weekend?'🧭 周末汇总夜报':'🌙 夜报');return{file,date,weekend,type,label};}
const cards=document.getElementById('cards');const data=entries.map(meta);document.getElementById('total').textContent=data.length+' 篇';document.getElementById('latest').textContent='最新：'+data[0].date;
function render(filter='all'){cards.innerHTML='';data.forEach(x=>{const show=filter==='all'||filter===x.type||(filter==='weekend'&&x.weekend&&x.type==='night');if(!show)return;const a=document.createElement('a');a.href=x.file;a.className='card';a.dataset.type=x.type;a.innerHTML=`<span class="badge ${x.type}">${x.label}</span>${x.weekend&&x.type==='night'?'<span class="badge weekend" style="margin-left:8px">Weekend</span>':''}<div class="date">${x.date}</div><div class="desc">${x.label} · 点击打开完整 HTML 报告</div>`;cards.appendChild(a);});}
render();document.querySelectorAll('.btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(btn.dataset.filter);}));
</script>
</body>
</html>
