<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大模型日报总目录</title>
  <style>
    :root{--bg:#0b1020;--panel:#111936;--line:#26345c;--text:#eef3ff;--muted:#aab6d4;--morning:#ffd166;--night:#8bc7ff;--other:#c8a6ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#23366f 0,#0b1020 38%,#060914 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",Arial,sans-serif;color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:36px 18px 80px}.hero{padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(17,25,54,.78);box-shadow:0 18px 60px rgba(0,0,0,.32)}h1{margin:0 0 8px;font-size:38px}.muted{color:var(--muted)}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.filter{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.filter.active{background:#2c73ff;border-color:#76a8ff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{display:block;min-height:142px;padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:linear-gradient(145deg,rgba(22,32,68,.92),rgba(12,18,38,.92));color:var(--text);text-decoration:none;transition:.18s ease;position:relative;overflow:hidden}.card:hover{transform:translateY(-3px);border-color:rgba(139,199,255,.62);box-shadow:0 16px 42px rgba(0,0,0,.28)}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.16);margin-bottom:14px}.morning{background:rgba(255,209,102,.14);color:#ffe3a0}.night{background:rgba(139,199,255,.14);color:#c9e8ff}.other{background:rgba(200,166,255,.14);color:#eadbff}.date{font-size:24px;font-weight:800;margin-bottom:8px}.desc{color:#b8c4df;font-size:14px}.footer{margin-top:24px;color:#93a0bf;font-size:13px}.toplink{color:#9ed1ff;text-decoration:none}.toplink:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>大模型日报总目录</h1>
      <p class="muted">自动汇总晨报 / 夜报 HTML。点击任意卡片打开对应日报；整张卡片可点击，hover 高亮，徽章自动区分类型。</p>
      <p><a class="toplink" href="night_2026-09-29.html">🌙 查看最新夜报：2026-09-29</a></p>
    </section>
    <div class="filters"><button class="filter active" data-type="all">全部</button><button class="filter" data-type="morning">晨报</button><button class="filter" data-type="night">夜报</button><button class="filter" data-type="other">其他</button></div>
    <section class="grid" id="grid"></section>
    <p class="footer">最后更新：2026-09-29 23:10 CST ｜ 最新夜报：<a class="toplink" href="night_2026-09-29.html">night_2026-09-29.html</a></p>
  </main>
  <script>
    const start=new Date('2026-06-29T00:00:00+08:00');
    const end=new Date('2026-09-29T00:00:00+08:00');
    const entries=[];
    function fmt(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
    for(let d=new Date(end);d>=start;d.setDate(d.getDate()-1)){
      const day=d.getDay(); const ds=fmt(d);
      if(day!==0 && day!==6){entries.push({type:'morning',date:ds,file:`morning_${ds}.html`,desc:'今日大模型晨报：快讯、业务视角、技术背景与产品卖点预测。'});}
      if(day!==6){entries.push({type:'night',date:ds,file:`night_${ds}.html`,desc: day===0?'周末汇总夜报：覆盖周六 + 周日两天 AI / 大模型资讯。':'今日大模型夜报：日内变化、工程趋势与可跟进行动。'});}
    }
    entries.push({type:'other',date:'2026-06-22_to_06-29',file:'2026-06-22_to_06-29.html',desc:'大模型日报归档与专题页面。'});
    const grid=document.getElementById('grid');
    const label={morning:'晨报',night:'夜报',other:'其他'};
    function render(type='all'){
      grid.innerHTML=entries.filter(e=>type==='all'||e.type===type).map(e=>`<a class="card" href="${e.file}" data-type="${e.type}"><span class="badge ${e.type}">${label[e.type]}</span><div class="date">${e.date}</div><div class="desc">${e.desc}</div></a>`).join('');
    }
    document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(btn.dataset.type)});
    render();
  </script>
</body>
</html>
