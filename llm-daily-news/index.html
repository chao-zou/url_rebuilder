<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大模型晨报/夜报历史总目录</title>
<style>
:root{--bg:#07111f;--card:#101c2f;--text:#eef6ff;--muted:#9fb3c8;--line:rgba(255,255,255,.12);--accent:#73d2ff;--night:#a78bfa;--morning:#fcd34d;--weekend:#ffbb55}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at 10% 0,#244a75 0,#07111f 42%,#050913 100%);color:var(--text)}.wrap{max-width:1180px;margin:0 auto;padding:32px 18px 70px}.hero{padding:34px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(115,210,255,.16),rgba(167,139,250,.12),rgba(16,28,47,.88));box-shadow:0 24px 80px rgba(0,0,0,.35)}h1{margin:0;font-size:40px;letter-spacing:-.03em}.lead{color:#d6e8ff;font-size:17px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.07);color:#fff;cursor:pointer}.btn.active{border-color:var(--accent);background:rgba(115,210,255,.16)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:block;border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));text-decoration:none;color:var(--text);transition:.18s}.card:hover{transform:translateY(-3px);border-color:rgba(115,210,255,.55);box-shadow:0 18px 42px rgba(0,0,0,.28)}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;margin-bottom:10px;border:1px solid var(--line)}.morning{color:#fde68a;background:rgba(252,211,77,.13);border-color:rgba(252,211,77,.35)}.night{color:#ddd6fe;background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.35)}.weekend{color:#ffe0a3;background:rgba(255,187,85,.14);border-color:rgba(255,187,85,.38)}.date{font-size:22px;font-weight:800}.path{color:var(--muted);font-size:13px;margin-top:8px}.foot{color:var(--muted);font-size:13px;margin-top:24px}a{color:#8bd9ff}@media(max-width:900px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><h1>大模型晨报 / 夜报历史总目录</h1><p class="lead">整张卡片可点击访问；自动区分晨报、夜报与周末汇总夜报。当前目录已更新到 2026-08-09。</p><div class="toolbar"><button class="btn active" data-filter="all">全部</button><button class="btn" data-filter="morning">晨报</button><button class="btn" data-filter="night">夜报</button><button class="btn" data-filter="weekend">周末汇总</button></div></header>
<main class="grid" id="grid"></main>
<p class="foot">GitHub Pages 根目录：<a href="https://chao-zou.github.io/url_rebuilder/llm-daily-news/">https://chao-zou.github.io/url_rebuilder/llm-daily-news/</a></p>
</div>
<script>
const files=["night_2026-08-09.html","night_2026-08-07.html","morning_2026-08-07.html","night_2026-08-06.html","morning_2026-08-06.html","night_2026-08-05.html","morning_2026-08-05.html","night_2026-08-04.html","morning_2026-08-04.html","morning_2026-08-03.html","night_2026-08-03.html","night_2026-08-02.html","night_2026-07-31.html","morning_2026-07-31.html","night_2026-07-30.html","morning_2026-07-30.html","night_2026-07-29.html","morning_2026-07-29.html","night_2026-07-28.html","morning_2026-07-28.html","night_2026-07-27.html","morning_2026-07-27.html","night_2026-07-26.html","night_2026-07-24.html","morning_2026-07-24.html","night_2026-07-23.html","morning_2026-07-23.html","night_2026-07-22.html","morning_2026-07-22.html","night_2026-07-21.html","morning_2026-07-21.html","night_2026-07-20.html","morning_2026-07-20.html","night_2026-07-19.html","night_2026-07-17.html","morning_2026-07-17.html","night_2026-07-16.html","morning_2026-07-16.html","night_2026-07-15.html","morning_2026-07-15.html","night_2026-07-14.html","morning_2026-07-14.html","night_2026-07-13.html","morning_2026-07-13.html","night_2026-07-12.html","night_2026-07-10.html","morning_2026-07-10.html","night_2026-07-09.html","morning_2026-07-09.html","night_2026-07-08.html","morning_2026-07-08.html","night_2026-07-07.html","morning_2026-07-07.html","night_2026-07-06.html","morning_2026-07-06.html","night_2026-07-05.html","morning_2026-07-05.html","night_2026-07-04.html","morning_2026-07-04.html","night_2026-07-03.html","morning_2026-07-03.html","night_2026-07-02.html","morning_2026-07-02.html","night_2026-07-01.html","morning_2026-07-01.html","night_2026-06-30.html","morning_2026-06-30.html","night_2026-06-29.html"];
const grid=document.getElementById('grid');
function meta(f){const isMorning=f.startsWith('morning');const d=(f.match(/\d{4}-\d{2}-\d{2}/)||['未知日期'])[0];const isWeekend=f==='night_2026-08-09.html';const kind=isMorning?'morning':(isWeekend?'weekend':'night');const type=isMorning?'☀️ 大模型晨报':(isWeekend?'🌙 周末汇总夜报':'🌙 大模型夜报');return {type,d,kind}}
function render(filter='all'){grid.innerHTML='';files.filter(f=>filter==='all'||meta(f).kind===filter||(filter==='night'&&meta(f).kind==='weekend')).forEach(f=>{const t=meta(f);const a=document.createElement('a');a.className='card';a.href=f;const label=t.kind==='morning'?'晨报':(t.kind==='weekend'?'周末汇总':'夜报');a.innerHTML=`<span class="badge ${t.kind}">${label}</span><div class="date">${t.type} ${t.d}</div><div class="path">${f}</div>`;grid.appendChild(a);});}
document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter);});render();
</script>
</body>
</html>
