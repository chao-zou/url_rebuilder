<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大模型晨报 / 夜报历史总目录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Noto Sans SC',system-ui,sans-serif;background:linear-gradient(135deg,#09111f,#15223b 42%,#0b1020);color:#eef4ff;min-height:100vh}.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);box-shadow:0 22px 80px rgba(0,0,0,.28)}.card{display:block;transition:all .18s ease}.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.13);border-color:rgba(110,231,255,.55)}.badge{border-radius:999px;padding:.25rem .65rem;font-size:.78rem}.morning{background:rgba(255,209,102,.18);color:#ffe8a6;border:1px solid rgba(255,209,102,.38)}.night{background:rgba(196,181,253,.18);color:#ddd6fe;border:1px solid rgba(196,181,253,.38)}
  </style>
</head>
<body>
  <main class="max-w-6xl mx-auto px-5 py-10">
    <section class="glass rounded-3xl p-8 md:p-10">
      <div class="flex flex-wrap items-center justify-between gap-4"><div><h1 class="text-4xl md:text-5xl font-black">大模型晨报 / 夜报历史总目录</h1><p class="mt-3 text-slate-300">卡片式索引，整张卡片可点击；自动区分晨报与夜报类型。当前最新：🌙 周末汇总夜报 2026-08-23。</p></div><a class="rounded-2xl px-4 py-3 bg-white/10 border border-white/15 hover:bg-white/20" href="https://chao-zou.github.io/url_rebuilder/llm-daily-news/">公网目录</a></div>
      <div class="mt-6 grid md:grid-cols-3 gap-3 text-sm text-slate-300"><div class="rounded-2xl bg-white/5 p-4">更新：2026-08-23</div><div class="rounded-2xl bg-white/5 p-4">类型：晨报 / 夜报</div><div class="rounded-2xl bg-white/5 p-4">路径：llm-daily-news/</div></div>
    </section>
    <section class="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-4" id="cards"></section>
  </main>
  <script>
    const reports = [

</body>
</html>
